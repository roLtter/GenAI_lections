name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: 3_1_LLM_agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        working-directory: 3_1_LLM_agent
        env:
          PYTHONPATH: .
        run: |
          pytest tests/test_agent.py \
            -m "not integration" \
            --cov=llm_agent/tool_currency_converter.py
            --cov-report=term \
            --cov-report=xml

      - name: Generate coverage badge
        working-directory: 3_1_LLM_agent
        run: python coverage_badge.py

      - name: Update coverage Gist
        working-directory: 3_1_LLM_agent
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: f80f71e47d22f37aebd88b201398889b
        run: |
          curl \
            --request PATCH \
            --header "Authorization: Bearer $GIST_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --data "{\"files\":{\"GenAI_lections_main.json\":{\"content\":$(jq -Rs . < coverage_badge.json)}}}" \
            "https://api.github.com/gists/$GIST_ID"
